# Deploys the Griffin backend: the FastAPI service plus the Python office pipeline,
# built from the repo root Dockerfile. The previous NIXPACKS config deployed only
# the Bun websocket shim with no Python, so the pipeline could not run there.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
numReplicas = 1
healthcheckPath = "/"
healthcheckTimeout = 100
